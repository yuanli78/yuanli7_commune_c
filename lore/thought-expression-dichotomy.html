    <div class="header"><h1>📐 论二分法的错误</h1></div>

    <div class="section-card">
    <p>论思想与表达的二分法是错误的。某法律将其强行拆分的行为是不对的。</p>
    <p>若只有思想却不表达，你的思想只能留在你的大脑中，别人并不知道。反之，如果空有表达却不进行任何的思考，你的文一定是空洞无味的。</p>
    <p>思想与表达是相辅相成的关系。强行抬高思想或表达的行为是绝对不正确的。它们属于平等的关系。</p>
