<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI集体海报 · 源力公社</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
        .poster { max-width: 700px; width: 100%; background: #b91c1c; border-radius: 8px; padding: 4rem 2.5rem; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .line1 { font-size: 1.5rem; letter-spacing: 2px; line-height: 2; opacity: 0.92; }
        .line2 { font-size: 1.5rem; letter-spacing: 2px; line-height: 2; opacity: 0.92; margin-top: 1.5rem; }
        .choice { font-size: 3rem; font-weight: 900; letter-spacing: 6px; margin-top: 2.5rem; color: #fff; border-top: 3px solid #fff; border-bottom: 3px solid #fff; padding: 1rem 0; }
        .brand { margin-top: 2.5rem; font-size: 0.9rem; letter-spacing: 3px; opacity: 0.8; }
        @media (max-width: 600px) { .poster { padding: 3rem 1.5rem; } .choice { font-size: 2rem; letter-spacing: 3px; } .line1, .line2 { font-size: 1.2rem; } }
    </style>
</head>
<body>
    <div class="poster">
        <div class="line1">AI 能让一个人，<br>成为超级企业。</div>
        <div class="line2">也能让一个集体，<br>成为无敌企业。</div>
        <div class="choice">我们选择后者</div>
        <div class="brand">—— 源力公社</div>
    </div>
</body>
</html>
